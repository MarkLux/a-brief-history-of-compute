lesson_id: ch2-01
questions:
  - id: q01
    type: single-choice
    question: 汇编语言相比机器语言的抽象提升是什么？
    options:
      - 用人类可读指令表达硬件操作，再翻译成机器码
      - 完全不需要翻译
      - 只能写网页
      - 只能运行在 JVM 上
    answer: 0
    explanation: 汇编把二进制机器指令包装成人类可读形式，但仍非常贴近硬件。
    source_anchor: 高级语言
  - id: q02
    type: single-choice
    question: C 语言为什么成为高级语言的重要基石？
    options:
      - 它和操作系统深度绑定，并成为许多编译器/解释器实现基础
      - 它不需要编译
      - 它只能做前端开发
      - 它没有函数
    answer: 0
    explanation: 文章强调 C 语言与 UNIX/Linux 共同发展，并支撑大量语言运行时实现。
    source_anchor: 编译器
  - id: q03
    type: single-choice
    question: 编译型语言和解释型语言的核心区别是什么？
    options:
      - 源代码是否先被编译成目标机器可执行产物
      - 是否能写变量
      - 是否能运行在浏览器
      - 是否有字符串
    answer: 0
    explanation: 编译型语言通常先生成平台相关二进制；解释型语言由解释器直接解释执行。
    source_anchor: 编译器
  - id: q04
    type: single-choice
    question: Java 为什么不能简单归类为纯编译型或纯解释型？
    options:
      - Java 先编译成字节码，再由 JVM 解释/JIT 执行
      - Java 完全不编译
      - Java 只能直接生成机器码
      - Java 没有运行时
    answer: 0
    explanation: Java 的“源代码 → 字节码 → JVM 运行/JIT”结合了编译和解释两种特性。
    source_anchor: 运行时
  - id: q05
    type: single-choice
    question: JIT 的核心价值是什么？
    options:
      - 运行时根据热点代码进行即时编译优化
      - 提前删除所有字节码
      - 让程序永远不需要 CPU
      - 把 JavaScript 改成 Java
    answer: 0
    explanation: JIT 在运行过程中收集信息并优化热点代码，换取更高峰值性能。
    source_anchor: 运行时
  - id: q06
    type: single-choice
    question: 字节码为什么有利于跨平台？
    options:
      - 不同平台只要有 JVM 就能执行同一份字节码
      - 字节码就是所有 CPU 的原生机器码
      - 字节码只能在 Windows 运行
      - 字节码不需要任何运行时
    answer: 0
    explanation: Java 把平台差异收敛到 JVM 适配层，一份字节码可在不同 JVM 上运行。
    source_anchor: 运行时
  - id: q07
    type: single-choice
    question: 字节码增强为什么可以不改源码却改变行为？
    options:
      - 运行的最终对象是字节码，修改字节码即可改变执行逻辑
      - 源码会自动同步变化
      - JVM 只能运行源码
      - 操作系统会重写 Java 文件
    answer: 0
    explanation: 文章指出 Java 运行的是字节码，因此可在编译后对字节码做插桩、AOP 等增强。
    source_anchor: 运行时
  - id: q08
    type: single-choice
    question: JVM 更像前端世界中的哪类角色？
    options:
      - 类似浏览器/V8 这样的运行时，负责执行中间表示并屏蔽底层差异
      - 类似 CSS 选择器
      - 类似图片压缩工具
      - 类似 Git 分支
    answer: 0
    explanation: 对前端同学可类比 V8/浏览器运行时：源码或中间表示最终交给运行时执行。
    source_anchor: 运行时
  - id: q09
    type: single-choice
    question: AOT 相比 JIT 更关注什么？
    options:
      - 提前编译以改善启动性能和部署成本
      - 只在运行热点时编译
      - 永远不生成机器码
      - 只用于解释 HTML
    answer: 0
    explanation: 文章提到云原生时代关注启动性能和内存占用，AOT 是 Java 生态的一个应对方向。
    source_anchor: 运行时
