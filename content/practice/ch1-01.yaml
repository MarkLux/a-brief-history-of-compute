lesson_id: ch1-01
tasks:
  - id: p01
    type: timeline
    prompt: 画一条“人机交互抽象层级演进”时间线：算盘/纸带 → 机器语言 → 存储程序 → 中断 → 操作系统。每个节点写 1 句话说明它解决的交互痛点。
    rubric:
      - 至少包含 5 个节点
      - 每个节点说明“解决了什么问题”
      - 能体现抽象层级逐步提高
    answer:
      - 答案应覆盖：至少包含 5 个节点
      - 答案应覆盖：每个节点说明“解决了什么问题”
      - 答案应覆盖：能体现抽象层级逐步提高
  - id: p02
    type: mechanism
    prompt: 用 4 步描述一次中断处理流程：外设等待、CPU 去做别的事、中断发生、CPU 回来处理。要求用“谁通知谁、谁保存现场、谁恢复执行”的方式写。
    rubric:
      - 包含等待与通知关系
      - 说明 CPU 不再空等的原因
      - 提到中断会打破顺序执行
    answer:
      - 答案应覆盖：包含等待与通知关系
      - 答案应覆盖：说明 CPU 不再空等的原因
      - 答案应覆盖：提到中断会打破顺序执行
  - id: p03
    type: explain
    prompt: 用前端同学能理解的类比解释“操作系统为什么出现”：可以类比浏览器运行时如何替你屏蔽底层 DOM/网络/事件细节。
    rubric:
      - 说出直接操作硬件的复杂性
      - 说明操作系统抽象了内存、任务调度等能力
      - 类比不能喧宾夺主，最后要回到操作系统
    answer:
      - 答案应覆盖：说出直接操作硬件的复杂性
      - 答案应覆盖：说明操作系统抽象了内存、任务调度等能力
      - 答案应覆盖：类比不能喧宾夺主，最后要回到操作系统
