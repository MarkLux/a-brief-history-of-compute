lesson_id: ch2-03
tasks:
  - id: p01
    type: diagram
    prompt: 画出 JVM 运行时内存分区：堆、虚拟机栈、方法区/元空间、程序计数器、本地方法栈，并标注它们分别存什么。
    rubric:
      - 包含主要内存区域
      - 区分线程私有和共享区域
      - 说明堆主要放对象
    answer:
      - 答案应覆盖：包含主要内存区域
      - 答案应覆盖：区分线程私有和共享区域
      - 答案应覆盖：说明堆主要放对象
  - id: p02
    type: compare
    prompt: 比较强引用、软引用、弱引用、虚引用：回收时机、典型用途、容易误解的点。
    rubric:
      - 覆盖四种引用
      - 说明软引用和弱引用差异
      - 虚引用不要写成用于直接取对象
    answer:
      - 答案应覆盖：覆盖四种引用
      - 答案应覆盖：说明软引用和弱引用差异
      - 答案应覆盖：虚引用不要写成用于直接取对象
  - id: p03
    type: flow
    prompt: 描述一次 GC 可达性分析：从 GC Roots 出发、标记可达对象、处理不可达对象、分代回收策略。
    rubric:
      - 包含 GC Roots
      - 说明可达/不可达
      - 提到分代策略
    answer:
      - 答案应覆盖：包含 GC Roots
      - 答案应覆盖：说明可达/不可达
      - 答案应覆盖：提到分代策略
  - id: p04
    type: case-study
    prompt: 设计一个缓存场景：什么时候用软引用可能合理？什么时候反而不应该依赖软引用？
    rubric:
      - 给出合理缓存场景
      - 说明内存压力下会被回收
      - 指出业务正确性不能依赖软引用对象必然存在
    answer:
      - 答案应覆盖：给出合理缓存场景
      - 答案应覆盖：说明内存压力下会被回收
      - 答案应覆盖：指出业务正确性不能依赖软引用对象必然存在
