lesson_id: ch1-05
tasks:
  - id: p01
    type: flow
    prompt: 写出 shell 执行一个新程序的大致过程：fork、写时复制、execve、调度、文件描述符继承。
    rubric:
      - 包含 fork 和 execve 的分工
      - 说明写时复制为什么节省成本
      - 提到文件描述符或资源继承
    answer:
      - 答案应覆盖：包含 fork 和 execve 的分工
      - 答案应覆盖：说明写时复制为什么节省成本
      - 答案应覆盖：提到文件描述符或资源继承
  - id: p02
    type: compare
    prompt: 比较进程和线程：地址空间、资源隔离、上下文切换成本、适合的协作方式。
    rubric:
      - 至少 4 个比较维度
      - 说明进程隔离更强
      - 说明线程共享资源带来的风险
    answer:
      - 答案应覆盖：至少 4 个比较维度
      - 答案应覆盖：说明进程隔离更强
      - 答案应覆盖：说明线程共享资源带来的风险
  - id: p03
    type: debug
    prompt: 一个服务 fork 后立刻 execve，你如何解释“子进程没有完整复制父进程内存”的现象？
    rubric:
      - 提到写时复制
      - 说明只有写入时才复制物理页
      - 说明 execve 会替换进程映像
    answer:
      - 答案应覆盖：提到写时复制
      - 答案应覆盖：说明只有写入时才复制物理页
      - 答案应覆盖：说明 execve 会替换进程映像
