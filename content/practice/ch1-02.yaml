lesson_id: ch1-02
tasks:
  - id: p01
    type: compare
    prompt: 用表格比较“用户态”和“内核态”：权限、能做的事情、为什么需要隔离、切换方式。
    rubric:
      - 至少 4 列比较维度
      - 说明隔离是为了安全和稳定
      - 提到系统调用是受控入口
    answer:
      - 答案应覆盖：至少 4 列比较维度
      - 答案应覆盖：说明隔离是为了安全和稳定
      - 答案应覆盖：提到系统调用是受控入口
  - id: p02
    type: flow
    prompt: 描述一次用户程序读取文件的大致路径：用户代码 → 系统调用 → 内核 → 文件系统/设备 → 返回结果。
    rubric:
      - 包含用户态到内核态切换
      - 说明系统调用的作用
      - 说明为什么普通程序不能直接操作硬件
    answer:
      - 答案应覆盖：包含用户态到内核态切换
      - 答案应覆盖：说明系统调用的作用
      - 答案应覆盖：说明为什么普通程序不能直接操作硬件
