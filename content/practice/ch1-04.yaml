lesson_id: ch1-04
tasks:
  - id: p01
    type: diagram
    prompt: 画出“虚拟地址 → 页表 → 物理地址”的转换流程，并标出页号、页内偏移和页表项。
    rubric:
      - 包含虚拟地址拆分
      - 包含页表映射
      - 说明页内偏移如何保留
    answer:
      - 答案应覆盖：包含虚拟地址拆分
      - 答案应覆盖：包含页表映射
      - 答案应覆盖：说明页内偏移如何保留
  - id: p02
    type: compare
    prompt: 比较分段和分页：组织方式、碎片问题、是否贴合程序逻辑、现代系统为什么更依赖分页。
    rubric:
      - 说明分段偏逻辑结构
      - 说明分页固定大小更利于管理
      - 提到碎片或换入换出
    answer:
      - 答案应覆盖：说明分段偏逻辑结构
      - 答案应覆盖：说明分页固定大小更利于管理
      - 答案应覆盖：提到碎片或换入换出
  - id: p03
    type: case-study
    prompt: 假设一个进程频繁访问一组最近用过的页面，说明 LRU 为什么可能有效；再说明一个 LRU 可能失效的访问模式。
    rubric:
      - 解释最近使用的局部性
      - 给出有效场景
      - 给出失效或抖动场景
    answer:
      - 答案应覆盖：解释最近使用的局部性
      - 答案应覆盖：给出有效场景
      - 答案应覆盖：给出失效或抖动场景
