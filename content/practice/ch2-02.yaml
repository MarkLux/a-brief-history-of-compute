lesson_id: ch2-02
tasks:
  - id: p01
    type: compare
    prompt: 把 JavaScript 原型对象和 Java 类做对比：对象创建、方法查找、类型约束、运行时灵活性。
    rubric:
      - 至少 4 个比较维度
      - 说明 Java 类更静态/结构明确
      - 说明 JS 原型更动态
    answer:
      - 答案应覆盖：至少 4 个比较维度
      - 答案应覆盖：说明 Java 类更静态/结构明确
      - 答案应覆盖：说明 JS 原型更动态
  - id: p02
    type: flow
    prompt: 写出类加载流程：加载、验证、准备、解析、初始化。每一步用一句话说明目的。
    rubric:
      - 顺序正确
      - 说明验证的安全价值
      - 说明初始化和对象创建不是一回事
    answer:
      - 答案应覆盖：顺序正确
      - 答案应覆盖：说明验证的安全价值
      - 答案应覆盖：说明初始化和对象创建不是一回事
  - id: p03
    type: explain
    prompt: 解释双亲委派模型为什么能避免“自己伪造 java.lang.String”这类问题。
    rubric:
      - 说明父加载器优先
      - 说明核心类库保护
      - 说明不是所有场景都必须完全遵循
    answer:
      - 答案应覆盖：说明父加载器优先
      - 答案应覆盖：说明核心类库保护
      - 答案应覆盖：说明不是所有场景都必须完全遵循
