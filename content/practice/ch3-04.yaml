lesson_id: ch3-04
tasks:
  - id: p01
    type: diagram
    prompt: 画出一次 RPC 调用链路：客户端代理、序列化、网络传输、服务端反序列化、方法执行、返回结果。
    rubric:
      - 包含 RPC 关键组件
      - 说明序列化必要性
      - 说明网络错误需要处理
    answer:
      - 答案应覆盖：包含 RPC 关键组件
      - 答案应覆盖：说明序列化必要性
      - 答案应覆盖：说明网络错误需要处理
  - id: p02
    type: design
    prompt: 设计一个服务发现 + 负载均衡流程：服务注册、健康检查、客户端获取实例、选择实例、失败重试。
    rubric:
      - 包含注册和发现
      - 包含健康状态
      - 包含负载均衡和失败处理
    answer:
      - 答案应覆盖：包含注册和发现
      - 答案应覆盖：包含健康状态
      - 答案应覆盖：包含负载均衡和失败处理
  - id: p03
    type: case-study
    prompt: 用一个电商下单场景解释 CAP：网络分区时，如果选择可用性，可能出现什么不一致？如果选择一致性，用户体验会怎样？
    rubric:
      - 给出具体业务场景
      - 说明 AP 的短暂不一致
      - 说明 CP 的拒绝/等待
    answer:
      - 答案应覆盖：给出具体业务场景
      - 答案应覆盖：说明 AP 的短暂不一致
      - 答案应覆盖：说明 CP 的拒绝/等待
  - id: p04
    type: explain
    prompt: 用自己的话解释 Raft 为什么需要 Leader，而不是所有节点随意写入。
    rubric:
      - 说明日志顺序
      - 说明冲突协调
      - 说明 Leader 简化一致性决策
    answer:
      - 答案应覆盖：说明日志顺序
      - 答案应覆盖：说明冲突协调
      - 答案应覆盖：说明 Leader 简化一致性决策
