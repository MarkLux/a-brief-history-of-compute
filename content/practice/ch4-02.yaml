lesson_id: ch4-02
tasks:
  - id: p01
    type: timeline
    prompt: 画出 IaaS → PaaS → 容器 → 云原生的演进线，每阶段写出“它想帮开发者少操心什么”。
    rubric:
      - 包含四个阶段
      - 每阶段说明解决的问题
      - 能指出 PaaS 的约束和容器的标准化价值
    answer:
      - 答案应覆盖：包含四个阶段
      - 答案应覆盖：每阶段说明解决的问题
      - 答案应覆盖：能指出 PaaS 的约束和容器的标准化价值
  - id: p02
    type: compare
    prompt: 比较单体和微服务：开发复杂度、部署、扩缩容、故障隔离、数据一致性。
    rubric:
      - 至少 5 个维度
      - 不把微服务写成绝对更好
      - 说明分布式复杂性增加
    answer:
      - 答案应覆盖：至少 5 个维度
      - 答案应覆盖：不把微服务写成绝对更好
      - 答案应覆盖：说明分布式复杂性增加
  - id: p03
    type: design
    prompt: 假设一个前端团队要上线一个 Node 服务，分别用 VM、PaaS、容器交付会有什么差异？
    rubric:
      - 结合前端/Node 背景
      - 说明环境一致性
      - 说明部署和运维责任边界
    answer:
      - 答案应覆盖：结合前端/Node 背景
      - 答案应覆盖：说明环境一致性
      - 答案应覆盖：说明部署和运维责任边界
